# Render Blueprint: Render > New > Blueprint > pick this repo. Then fill the "sync: false" secrets in the dashboard.
services:
  - type: web
    name: hbm-ai-visibility
    runtime: docker
    plan: starter            # free instances have no disk: every deploy would wipe users and audits
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: hbm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: HBM_DATA_DIR
        value: /data
      - key: TRUSTED_PROXY
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: homebuildermarketers.com
      - key: ADMIN_EMAILS
        value: lav@homebuildermarketers.com
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: DATAWISE_TOKEN
        sync: false
