{% macro scope_field(value='', kind='root', big=false, id='analyze-url', placeholder='Enter a business website, e.g. justindoylehomes.com') %}
<div class="sq {{ 'sq-big' if big }}" data-suggest="{{ url_for('suggest') }}">
  <svg class="sq-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <input id="{{ id }}" type="text" name="url" value="{{ value }}" placeholder="{{ placeholder }}" aria-label="Business website" autocomplete="off" spellcheck="false" required
    role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="{{ id }}-list">
  <button class="sq-clear" type="button" aria-label="Clear" {% if not value %}hidden{% endif %}>
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <label class="sq-scope"><span class="sr-only">Scope</span>
    <select name="scope">
      {% for k, lab in (('root', 'Root Domain'), ('url', 'Exact URL'), ('subdomain', 'Subdomain'), ('subfolder', 'Subfolder')) %}
      <option value="{{ k }}" {{ 'selected' if kind == k }}>{{ lab }}</option>{% endfor %}
    </select></label>
  <ul class="sq-list" id="{{ id }}-list" role="listbox" hidden></ul>
</div>
{% endmacro %}

{% macro analyze_bar(value='', kind='root') %}
<form class="analyze2" method="post" action="{{ url_for('create_audit') }}">
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  {{ scope_field(value, kind) }}
  <button class="btn btn-dark" type="submit">Analyze</button>
</form>
{% endmacro %}
