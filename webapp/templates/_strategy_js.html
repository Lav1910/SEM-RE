<script>
(function () {
  var csrf = '{{ session.csrf }}';
  /* filters: lane tabs (Strategy Plan) and status buttons (both pages) work together */
  var laneSel = 'all', statSel = 'all';
  try { statSel = localStorage.getItem('hbm-status-filter') || 'all'; } catch (e) {}
  function applyFilters() {
    var box = document.querySelector('[data-status-filter]'); if (!box) return;
    var cards = document.querySelectorAll(box.dataset.statusFilter), shown = 0;
    cards.forEach(function (c) {
      var ok = (laneSel === 'all' || !c.dataset.lane || c.dataset.lane === laneSel) && (statSel === 'all' || c.dataset.status === statSel);
      c.hidden = !ok; if (ok) shown++;
    });
    box.querySelectorAll('[data-f]').forEach(function (b) { b.classList.toggle('on', b.dataset.f === statSel); });
    var empty = box.nextElementSibling; if (empty && empty.classList.contains('sf-empty')) empty.hidden = shown > 0;
  }
  function recount() {
    var box = document.querySelector('[data-status-filter]'); if (!box) return;
    var cards = Array.prototype.slice.call(document.querySelectorAll(box.dataset.statusFilter));
    var n = {all: cards.length, todo: 0, doing: 0, done: 0};
    cards.forEach(function (c) { n[c.dataset.status] = (n[c.dataset.status] || 0) + 1; });
    Object.keys(n).forEach(function (k) { var el = box.querySelector('[data-count="' + k + '"]'); if (el) el.textContent = n[k]; });
    var pct = function (k) { return n.all ? Math.round(100 * n[k] / n.all) : 0; };
    box.querySelector('.b-done').style.width = pct('done') + '%';
    box.querySelector('.b-doing').style.width = pct('doing') + '%';
    box.querySelector('[data-sum]').textContent = n.done + ' of ' + n.all + ' done';
    var ring = document.querySelector('.sp-ring');
    if (ring) { ring.style.setProperty('--p', pct('done')); ring.querySelector('b').textContent = n.done; }
  }
  document.querySelectorAll('.lane-tabs [data-tab]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.lane-tabs [data-tab]').forEach(function (o) { o.classList.toggle('on', o === b); });
      laneSel = b.dataset.tab; applyFilters();
    });
  });
  document.querySelectorAll('[data-status-filter] [data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      statSel = b.dataset.f; try { localStorage.setItem('hbm-status-filter', statSel); } catch (e) {}
      applyFilters();
    });
  });
  var LAB = {todo: '○ To do', doing: '◐ In progress', done: '✓ Done'}, VERB = {todo: 'Set to do', doing: 'Started', done: 'Done'};
  document.querySelectorAll('[data-status-form]').forEach(function (f) {
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = e.submitter || document.activeElement; if (!btn || !btn.value) return;
      var st = btn.value, card = f.closest('.task'), prev = card.dataset.status;
      if (st === prev) return;
      var setUI = function (v) {
        card.dataset.status = v;
        card.className = card.className.replace(/\bst-\w+/, 'st-' + v);
        f.querySelectorAll('.stat-btn').forEach(function (b) { var on = b.value === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
        var badge = card.querySelector('[data-badge]'); if (badge) badge.textContent = LAB[v];
        recount(); applyFilters();
      };
      setUI(st);  // show it straight away; undo if saving fails
      var fd = new FormData(f); fd.set('status', st);
      fetch(f.action, {method: 'POST', body: fd, headers: {'X-Requested-With': 'fetch'}, credentials: 'same-origin'})
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (d) { f.querySelector('[data-stamp]').textContent = VERB[st] + (d.who ? ' by ' + d.who : '') + ' · just now'; })
        .catch(function () { setUI(prev); f.querySelector('[data-stamp]').textContent = 'Couldn’t save. Try again.'; });
    });
  });
  applyFilters();
  /* content generator */
  var writer = document.getElementById('writer');
  function pieces() { return Array.prototype.slice.call(document.querySelectorAll('.piece')); }
  function setState(p, st, err) {
    p.dataset.status = st;
    var lab = p.querySelector('.piece-state');
    lab.textContent = st === 'done' ? 'Ready' : st === 'failed' ? 'Failed: ' + (err || 'try again') : (st === 'queued' || st === 'running') ? 'Writing…' : 'Not generated';
    lab.classList.toggle('writing', st === 'queued' || st === 'running');
    p.querySelector('.piece-copy').hidden = st !== 'done';
    p.querySelector('.piece-toggle').hidden = st !== 'done';
  }
  function loadPiece(p, open) {
    return fetch(p.dataset.piece, {credentials: 'same-origin'}).then(function (r) { return r.json(); }).then(function (d) {
      p._text = d.text; var body = p.querySelector('.piece-body'); body.innerHTML = d.html;
      if (open) { body.hidden = false; p.querySelector('.piece-toggle').textContent = 'Hide'; }
    });
  }
  var polling = false;
  function poll() {
    if (polling) return; polling = true;
    (function tick() {
      fetch('{{ url_for("strategy_content_json", aid=a.id) }}', {credentials: 'same-origin'}).then(function (r) { return r.json(); }).then(function (rows) {
        var map = {}; rows.forEach(function (r) { map[r.kind + '/' + r.key] = r; });
        var busy = false;
        pieces().forEach(function (p) {
          var r = map[p.dataset.kind + '/' + p.dataset.key]; if (!r) return;
          var was = p.dataset.status;
          if (r.status !== was) { setState(p, r.status, r.error); if (r.status === 'done') loadPiece(p, false); }
          if (r.status === 'queued' || r.status === 'running') busy = true;
        });
        if (busy) setTimeout(tick, 2500); else polling = false;
      }).catch(function () { setTimeout(tick, 5000); });
    })();
  }
  document.querySelectorAll('form[data-gen-form], form.gen-all').forEach(function (f) {
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var pv = f.querySelector('input[name=provider]'); if (pv && writer) pv.value = writer.value;
      var fd = new FormData(f), kind = fd.get('kind'), key = fd.get('key');
      pieces().forEach(function (p) { if (kind === 'all' || (p.dataset.kind === kind && (!key || p.dataset.key === key))) setState(p, 'queued'); });
      fetch(f.action, {method: 'POST', body: fd, headers: {'X-Requested-With': 'fetch'}, credentials: 'same-origin'}).then(function () { setTimeout(poll, 800); });
    });
  });
  pieces().forEach(function (p) {
    p.querySelector('.piece-toggle').addEventListener('click', function (e) {
      var body = p.querySelector('.piece-body'), btn = e.currentTarget;
      if (body.hidden && !body.innerHTML) { loadPiece(p, true); return; }
      body.hidden = !body.hidden; btn.textContent = body.hidden ? 'Show' : 'Hide';
    });
    p.querySelector('.piece-copy').addEventListener('click', function (e) {
      var btn = e.currentTarget, go = function () {
        navigator.clipboard.writeText(p._text || '').then(function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500); });
      };
      if (p._text === undefined) loadPiece(p, false).then(go); else go();
    });
  });
  if (pieces().some(function (p) { return p.dataset.status === 'queued' || p.dataset.status === 'running'; })) poll();
  if (location.hash) { var t = document.querySelector(location.hash); if (t) t.classList.add('flash-target'); }
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    if (b._wired) return; b._wired = true;
  });
})();
</script>
