{# change 48: the Audits area's own sidebar (like the one inside an audit) #}
{% set _ep = request.endpoint %}
<nav class="side" aria-label="Audits">
  <img class="side-logo" src="{{ url_for('static', filename='hbm-logo.png') }}" alt="Home Builder Marketers">
  <div class="side-title">AEO Snapshot</div>
  <div class="side-group">Audits</div>
  <a class="side-link {{ 'on' if _ep == 'dashboard' }}" href="{{ url_for('dashboard') }}">All audits</a>
  {% if can('share') %}
  <div class="side-group">Client link</div>
  <a class="side-link {{ 'on' if _ep == 'links_home' }}" href="{{ url_for('links_home') }}">Report tracking{% set n = links_new() %}{% if n %} <span class="side-count" title="Opened in the last 24 hours">{{ n }}</span>{% endif %}</a>
  {% endif %}
  <div class="side-group">Files</div>
  <a class="side-link {{ 'on' if _ep == 'inventory' }}" href="{{ url_for('inventory') }}">Inventory</a>
</nav>
