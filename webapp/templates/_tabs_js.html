<script>
document.querySelectorAll('[data-tabs]').forEach(function (group) {
  var name = group.dataset.tabs;
  group.querySelectorAll('[data-tab]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      group.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b === btn); });
      document.querySelectorAll('[data-pane^="' + name + '-"]').forEach(function (p) { p.hidden = p.dataset.pane !== name + '-' + btn.dataset.tab; });
    });
  });
});
document.querySelectorAll('[data-copy]').forEach(function (b) {
  b.addEventListener('click', function () {
    var el = document.getElementById(b.dataset.copy);
    var text = el.value !== undefined ? el.value : el.innerText;
    var done = function () { var t = b.textContent; b.textContent = 'Copied'; setTimeout(function () { b.textContent = t; }, 1500); };
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, function () { if (el.select) el.select(); }); } else if (el.select) { el.select(); }
  });
});
document.querySelectorAll('[data-open-tab]').forEach(function (l) {
  l.addEventListener('click', function () { var b = document.querySelector('[data-tabs="ts"] [data-tab="' + l.dataset.openTab + '"]'); if (b) b.click(); });
});
</script>
